name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using sdkmanager: $SDKMGR"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.10.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs=-Xmx3g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-agent-cms-apk
          path: app/build/outputs/apk/debug/app-debug.apk
